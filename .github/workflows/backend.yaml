# ─────────────────────────────────────────────────────────────────────────────
# Backend CI — Python formatting checks via Ruff
# Runs on pushes and PRs to main/dev when backend files change
# ─────────────────────────────────────────────────────────────────────────────
name: Python CI

on:
  push:
    branches: [main, dev]
    paths: ['backend/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ruff format check across supported Python versions ───────────────────
  format-check:
    name: Ruff Format (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install formatter
        run: pip install "ruff>=0.15.5"

      - name: Verify formatting
        run: ruff format --check . --exclude .venv --exclude venv

      - name: Detect logic errors
        run: ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github .

      - name: Install offline API test dependencies
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          names = {
              'fastapi', 'pydantic', 'aiohttp', 'aiofiles', 'aiocache',
              'python-mimeparse', 'python-socketio', 'regex', 'asgiref', 'loguru',
          }
          with open('pyproject.toml', 'rb') as source:
              dependencies = tomllib.load(source)['project']['dependencies']
          selected = [item for item in dependencies if item.split('==')[0] in names]
          assert len(selected) == len(names)
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *selected])
          PY

      - name: Offline API contract regressions
        run: python -m unittest discover -s backend/tests -p 'test_api_quality.py' -v
